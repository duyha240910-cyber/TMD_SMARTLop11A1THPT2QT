<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TMD Smart Sensor</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; padding: 20px; text-align: center; margin: 0; height: 100vh; display: flex; flex-direction: column; justify-content: center;}
        
        /* Màn hình nhập mã */
        #login-screen { display: flex; flex-direction: column; align-items: center; }
        .login-box { background: #1e293b; padding: 30px; border-radius: 16px; width: 80%; max-width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .login-box input { padding: 15px; font-size: 24px; text-align: center; text-transform: uppercase; width: 100%; border: 2px solid #334155; border-radius: 8px; margin-bottom: 15px; background: #0f172a; color: white; letter-spacing: 5px; font-weight: bold; box-sizing: border-box;}
        .login-box select { width: 100%; padding: 15px; font-size: 18px; border-radius: 8px; margin-bottom: 15px; background: #0f172a; color: white; border: 2px solid #334155; box-sizing: border-box;}
        .login-box button { width: 100%; padding: 15px; font-size: 18px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: bold; }
        
        /* Màn hình đo */
        #main-screen { display: none; }
        .box { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        button { width: 100%; padding: 15px; margin: 10px 0; font-size: 16px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-connect { background: #f59e0b; color: white; }
        .btn-start { background: #10b981; color: white; }
        .btn-stop { background: #ef4444; color: white; }
        button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
        .value { font-size: 36px; font-weight: bold; color: #10b981; margin: 10px 0;}
        .status { font-size: 14px; color: #94a3b8; }
        .room-badge { background: #3b82f6; padding: 5px 15px; border-radius: 20px; font-weight: bold; display: inline-block; margin-bottom: 20px;}
    </style>
</head>
<body>
    <!-- MÀN HÌNH 1: NHẬP MÃ PHÒNG -->
    <div id="login-screen">
        <div class="login-box">
            <h2>TMD SMART SENSOR</h2>
            <p>Nhập mã phòng do máy tính cấp</p>
            <input type="text" id="input-room" placeholder="MÃ PHÒNG" maxlength="6">
            <select id="select-role">
                <option value="GROUND">Máy A: Mặt đất (GROUND)</option>
                <option value="BUILDING">Máy B: Tòa nhà (BUILDING)</option>
            </select>
            <button onclick="joinRoom()">Kết nối</button>
        </div>
    </div>

    <!-- MÀN HÌNH 2: ĐO ĐẠC -->
    <div id="main-screen">
        <div class="room-badge">Phòng: <span id="display-room"></span></div>
        
        <div class="box">
            <button id="btn-start" class="btn-start" disabled onclick="startMeasure()">BẮT ĐẦU GỬI DỮ LIỆU</button>
            <button id="btn-stop" class="btn-stop" disabled onclick="stopMeasure()">DỪNG LẠI</button>
        </div>

        <div class="box">
            <p>Gia tốc cảm biến (m/s²):</p>
            <div class="value" id="accel-value">0.00</div>
            <p class="status" id="status">Trạng thái: Đang kết nối...</p>
        </div>
    </div>

    <script>
        let ws;
        let isMeasuring = false;
        let lastTime = 0;
        let currentRoom = "";
        let currentRole = "";

        function joinRoom() {
            currentRoom = document.getElementById('input-room').value.trim().toUpperCase();
            currentRole = document.getElementById('select-role').value;
            
            if (!currentRoom) return alert("Vui lòng nhập mã phòng!");

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onopen = () => {
                // Gửi yêu cầu vào phòng
                ws.send(JSON.stringify({ type: 'join', role: currentRole, roomCode: currentRoom }));
                
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-screen').style.display = 'block';
                document.getElementById('display-room').innerText = currentRoom;
                document.getElementById('status').innerText = "Trạng thái: Đã vào phòng. Chờ lệnh!";
                document.getElementById('status').style.color = "#10b981";
                document.getElementById('btn-start').disabled = false;
            };

            ws.onclose = () => {
                document.getElementById('status').innerText = "Trạng thái: Mất kết nối!";
                document.getElementById('status').style.color = "#ef4444";
                document.getElementById('btn-start').disabled = true;
                document.getElementById('btn-stop').disabled = true;
            };
        }

        async function startMeasure() {
            // Xin quyền cảm biến
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceMotionEvent.requestPermission();
                    if (permission !== 'granted') return alert("Bạn cần cấp quyền cảm biến để đo!");
                } catch (error) { return alert("Lỗi xin quyền: " + error); }
            }

            isMeasuring = true;
            document.getElementById('status').innerText = "ĐANG ĐO VÀ GỬI...";
            document.getElementById('status').style.color = "#3b82f6";
            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-stop').disabled = false;
            window.addEventListener('devicemotion', handleMotion);
        }

        function stopMeasure() {
            isMeasuring = false;
            document.getElementById('status').innerText = "Đã dừng gửi.";
            document.getElementById('status').style.color = "#94a3b8";
            document.getElementById('btn-start').disabled = false;
            document.getElementById('btn-stop').disabled = true;
            window.removeEventListener('devicemotion', handleMotion);
        }

        function handleMotion(event) {
            if (!isMeasuring) return;
            const acc = event.accelerationIncludingGravity;
            if (!acc || acc.x === null) return;
            
            const magnitude = Math.sqrt(acc.x*acc.x + acc.y*acc.y + acc.z*acc.z);
            document.getElementById('accel-value').innerText = magnitude.toFixed(2);

            const now = Date.now();
            if (now - lastTime > 50) { // Gửi 20 lần/giây
                lastTime = now;
                if (ws && ws.readyState === 1) {
                    ws.send(JSON.stringify({
                        type: 'sensor-data',
                        role: currentRole,
                        magnitude: magnitude
                    }));
                }
            }
        }
    </script>
</body>
</html>
