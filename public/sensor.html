<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TMD Smart Sensor</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #0f172a; --bg-card: #1e293b; --primary: #3b82f6; --success: #10b981; --danger: #ef4444; --text-light: #f8fafc; --text-muted: #94a3b8; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-dark); color: var(--text-light); margin: 0; padding: 20px; height: 100vh; display: flex; flex-direction: column; overscroll-behavior: none; user-select: none; }
        
        #login-screen { display: flex; flex-direction: column; justify-content: center; height: 100%; align-items: center;}
        .login-card { background: var(--bg-card); padding: 30px; border-radius: 24px; width: 100%; max-width: 380px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .login-card h2 { text-align: center; margin-top: 0; font-weight: 800; letter-spacing: 1px; color: var(--primary); font-size: 28px;}
        
        .input-group { margin-bottom: 20px; }
        .input-group label { font-size: 13px; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; display: block; text-transform: uppercase;}
        .login-card input, .login-card select { width: 100%; padding: 16px; font-size: 18px; font-family: 'Inter', sans-serif; background: #0f172a; border: 1px solid #334155; border-radius: 12px; color: white; outline: none; transition: 0.2s; }
        .login-card input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        .login-card input[name="room"] { text-align: center; letter-spacing: 8px; font-size: 24px; font-weight: 800; text-transform: uppercase; }
        
        .btn { width: 100%; padding: 18px; font-size: 16px; font-weight: 800; border-radius: 14px; border: none; cursor: pointer; transition: 0.2s; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; gap: 10px;}
        .btn-connect { background: var(--primary); color: white; box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4); }
        .btn-connect:active { transform: scale(0.96); }
        
        #main-screen { display: none; height: 100%; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .room-badge { background: rgba(59, 130, 246, 0.2); color: #93c5fd; padding: 8px 16px; border-radius: 30px; font-weight: 800; font-size: 14px; letter-spacing: 1px;}
        .role-badge { padding: 8px 16px; border-radius: 30px; font-weight: 800; font-size: 14px; letter-spacing: 1px; color: white; }
        .role-GROUND { background: #3b82f6; }
        .role-BUILDING { background: #ef4444; }
        
        .sensor-display { background: var(--bg-card); border-radius: 30px; padding: 40px 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); margin-bottom: 30px; position: relative; overflow: hidden; }
        .sensor-display::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, var(--primary), var(--success), var(--danger)); }
        .sensor-label { font-size: 14px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        .sensor-value { font-size: 64px; font-weight: 800; color: var(--text-light); line-height: 1; }
        .sensor-unit { font-size: 18px; color: var(--text-muted); font-weight: 600; margin-left: 5px;}
        
        .status-indicator { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--text-muted); margin-top: 15px; background: #0f172a; padding: 8px 16px; border-radius: 20px;}
        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text-muted); }
        .recording .dot { background: var(--danger); animation: pulse 1s infinite; }
        .recording { color: var(--danger); }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        .controls { display: flex; flex-direction: column; gap: 15px; margin-top: auto; }
        .btn-start { background: var(--success); color: white; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4); font-size: 20px; padding: 24px; }
        .btn-stop { background: var(--danger); color: white; box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4); font-size: 18px; }
        .btn:disabled { opacity: 0.5; box-shadow: none; transform: none; }
        .btn-start:active:not(:disabled) { transform: scale(0.96); }

        .btn-fullscreen { background: transparent; border: 1px solid var(--text-muted); color: var(--text-muted); font-size: 12px; padding: 5px 10px; width: auto; position: absolute; top: 20px; right: 20px; z-index: 10;}
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-card">
            <h2>TMD SENSOR</h2>
            <p style="text-align:center; color:var(--text-muted); font-size:14px; margin-bottom:30px;">Kết nối thiết bị của bạn với phòng Lab</p>
            
            <div class="input-group">
                <label>Mã phòng</label>
                <input type="text" id="input-room" name="room" placeholder="------" maxlength="6" autocomplete="off" autocorrect="off" spellcheck="false">
            </div>
            
            <div class="input-group">
                <label>Vị trí đặt máy</label>
                <select id="select-role">
                    <option value="GROUND">🟦 Máy A: Mặt đất (Ground)</option>
                    <option value="BUILDING">🟥 Máy B: Tòa nhà (Building)</option>
                </select>
            </div>
            
            <button class="btn btn-connect" onclick="joinRoom()">KẾT NỐI NGAY</button>
        </div>
    </div>

    <div id="main-screen">
        <button class="btn btn-fullscreen" onclick="toggleFullScreen()">Toàn màn hình</button>
        <div class="header">
            <div class="room-badge">PHÒNG: <span id="display-room"></span></div>
            <div id="role-badge" class="role-badge">ROLE</div>
        </div>

        <div class="sensor-display">
            <div class="sensor-label">Gia tốc hiện tại</div>
            <div><span class="sensor-value" id="accel-value">0.00</span><span class="sensor-unit">m/s²</span></div>
            <div class="status-indicator" id="status-badge">
                <div class="dot"></div>
                <span id="status-text">Đang chờ lệnh...</span>
            </div>
        </div>

        <div class="controls">
            <button id="btn-start" class="btn btn-start" disabled onclick="startMeasure()">▶ BẮT ĐẦU ĐO</button>
            <button id="btn-stop" class="btn btn-stop" disabled onclick="stopMeasure()">⏹ DỪNG LẠI</button>
        </div>
    </div>

    <script>
        let ws, isMeasuring = false, lastTime = 0, currentRoom = "", currentRole = "";
        let isReconnecting = false;

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam) {
                document.getElementById('input-room').value = roomParam.toUpperCase();
                document.getElementById('input-room').style.borderColor = '#10b981';
            }
        };

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Lỗi không thể bật toàn màn hình: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function joinRoom() {
            currentRoom = document.getElementById('input-room').value.trim().toUpperCase();
            currentRole = document.getElementById('select-role').value;
            
            if (!currentRoom) return alert("Vui lòng nhập mã phòng!");

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'flex';
            document.getElementById('display-room').innerText = currentRoom;
            
            let badge = document.getElementById('role-badge');
            badge.innerText = currentRole;
            badge.className = `role-badge role-${currentRole}`;
            
            connectWebSocket();
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onopen = () => {
                isReconnecting = false;
                ws.send(JSON.stringify({ type: 'join', role: currentRole, roomCode: currentRoom }));
                document.getElementById('status-text').innerText = "Sẵn sàng hoạt động";
                document.getElementById('status-text').style.color = "var(--text-muted)";
                document.getElementById('btn-start').disabled = false;
            };

            ws.onclose = () => {
                if (isReconnecting) return;
                isReconnecting = true;
                document.getElementById('status-badge').classList.remove('recording');
                document.getElementById('status-text').innerText = "Mất kết nối! Đang thử lại...";
                document.getElementById('status-text').style.color = "var(--danger)";
                document.getElementById('btn-start').disabled = true;
                document.getElementById('btn-stop').disabled = true;
                
                // TỰ ĐỘNG KẾT NỐI LẠI SAU 3 GIÂY
                setTimeout(connectWebSocket, 3000);
            };
        }

        async function startMeasure() {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceMotionEvent.requestPermission();
                    if (permission !== 'granted') return alert("Bạn cần cấp quyền cảm biến để đo!");
                } catch (error) { return alert("Lỗi xin quyền: " + error); }
            }

            isMeasuring = true;
            document.getElementById('status-badge').classList.add('recording');
            document.getElementById('status-text').innerText = "ĐANG GHI DỮ LIỆU...";
            
            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-stop').disabled = false;
            window.addEventListener('devicemotion', handleMotion);
        }

        function stopMeasure() {
            isMeasuring = false;
            document.getElementById('status-badge').classList.remove('recording');
            document.getElementById('status-text').innerText = "Đã dừng ghi";
            
            document.getElementById('btn-start').disabled = false;
            document.getElementById('btn-stop').disabled = true;
            window.removeEventListener('devicemotion', handleMotion);
        }

        function handleMotion(event) {
            if (!isMeasuring) return;
            const acc = event.accelerationIncludingGravity;
            if (!acc || acc.x === null) return;
            
            const now = performance.now();
            if (now - lastTime > 33) { 
                lastTime = now;
                if (ws && ws.readyState === 1) {
                    ws.send(JSON.stringify({ type: 'sensor-data', role: currentRole, t: now, x: acc.x, y: acc.y, z: acc.z }));
                }
            }
            const magnitude = Math.sqrt(acc.x*acc.x + acc.y*acc.y + acc.z*acc.z);
            document.getElementById('accel-value').innerText = magnitude.toFixed(2);
        }
    </script>
</body>
</html>
