<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>TMD SMART - Ultimate Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f7f6; --card-bg: rgba(255, 255, 255, 0.85); --primary: #4f46e5;
            --ground-color: #3b82f6; --building-color: #ef4444; --text-main: #1e293b; --text-muted: #64748b;
        }
        body {
            font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            color: var(--text-main); margin: 0; padding: 20px; min-height: 100vh;
            transition: background 0.3s;
        }
        /* Hiệu ứng cảnh báo toàn màn hình */
        body.alert-mode { background: linear-gradient(135deg, #fecaca 0%, #f87171 100%); animation: pulseBg 1s infinite alternate; }
        @keyframes pulseBg { from { filter: brightness(1); } to { filter: brightness(0.9); } }

        .container { max-width: 1400px; margin: auto; }
        
        .header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); backdrop-filter: blur(10px);
            padding: 15px 30px; border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.05); margin-bottom: 25px;
        }
        .header h1 { margin: 0; font-size: 24px; font-weight: 800; color: var(--primary); letter-spacing: 1px;}
        
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr 350px; gap: 20px; }
        .card {
            background: var(--card-bg); backdrop-filter: blur(10px); border-radius: 20px; padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.05); transition: transform 0.2s ease;
        }
        .card-title { font-weight: 800; font-size: 16px; margin-bottom: 15px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;}

        .metric-row { display: flex; justify-content: space-between; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #e2e8f0;}
        .metric-label { font-size: 15px; color: var(--text-muted); font-weight: 600;}
        .metric-value { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
        .val-ground { color: var(--ground-color); }
        .val-building { color: var(--building-color); transition: color 0.3s; }
        .val-building.danger { color: #dc2626; text-shadow: 0 0 10px rgba(220, 38, 38, 0.5); }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .btn {
            padding: 12px 24px; border-radius: 12px; border: none; font-weight: 700; font-size: 15px;
            cursor: pointer; transition: 0.2s; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-export { background: #10b981; color: white; }

        #liveChart-container { grid-column: span 2; height: 350px; }
        #canvas3d-container { grid-column: span 3; height: 400px; background: #0f172a; border-radius: 20px; position: relative; overflow: hidden; cursor: grab;}
        #canvas3d { width: 100%; height: 100%; display: block;}

        .resonance-box { background: #f8fafc; border-radius: 15px; padding: 20px; text-align: center; border: 2px dashed #cbd5e1; }
        .badge-res { margin-top: 15px; padding: 12px; border-radius: 12px; font-weight: 800; color: white; background: #94a3b8; font-size: 15px;}

        /* CSS cho QR Code */
        #qrcode-box { text-align: center; padding: 10px; background: white; border-radius: 12px; display: inline-block; margin-top: 10px;}
        
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            display: flex; align-items: center; justify-content: center; z-index: 999;
        }
        .login-card {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(20px); padding: 50px;
            border-radius: 30px; text-align: center; color: white; width: 400px;
        }
        .login-card input {
            width: 100%; padding: 15px; font-size: 24px; text-align: center; letter-spacing: 10px;
            background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.3); color: white;
            border-radius: 12px; margin-bottom: 20px; box-sizing: border-box; font-weight: bold;
        }
        .login-card button {
            width: 100%; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 12px;
            background: #4f46e5; color: white; border: none; cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-card">
            <h1 style="margin-top:0; font-size: 36px; color: #818cf8;">TMD SMART</h1>
            <p style="color: #c7d2fe; margin-bottom: 30px;">Phiên bản Ultimate</p>
            <input type="text" id="input-room" placeholder="MÃ PHÒNG" maxlength="6" autocomplete="off">
            <button onclick="joinRoom()">BẮT ĐẦU KẾT NỐI</button>
        </div>
    </div>

    <div class="container" id="main-screen" style="display:none;">
        <div class="header no-print">
            <h1>TMD SMART LAB</h1>
            <div>
                <span id="status-g" style="font-weight:bold; color:#64748b; margin-right: 15px;">GROUND: Chờ...</span>
                <span id="status-b" style="font-weight:bold; color:#64748b; margin-right: 15px;">BUILDING: Chờ...</span>
                <span style="background: #fef08a; color: #854d0e; padding: 8px 16px; border-radius: 12px; font-weight: 800; font-size: 18px;">Phòng: <span id="display-room"></span></span>
            </div>
        </div>

        <div class="grid-layout">
            <div class="card no-print">
                <div class="card-title">Mặt đất (Ground)</div>
                <div class="metric-row"><span class="metric-label">Biên độ A</span><span class="metric-value val-ground" id="g-amp">0.000</span></div>
                <div class="metric-row"><span class="metric-label">Tần số f</span><span class="metric-value val-ground" id="g-freq">0.00</span></div>
                <div class="metric-row" style="border:none;"><span class="metric-label">Chu kỳ T</span><span class="metric-value val-ground" id="g-period">0.00</span></div>
            </div>

            <div class="card no-print" style="border-left: 4px solid var(--building-color);">
                <div class="card-title">Tòa nhà (Building)</div>
                <div class="metric-row"><span class="metric-label">Biên độ A</span><span class="metric-value val-building" id="b-amp">0.000</span></div>
                <div class="metric-row"><span class="metric-label">Tần số f</span><span class="metric-value val-building" id="b-freq">0.00</span></div>
                <div class="metric-row" style="border:none;"><span class="metric-label">Chu kỳ T</span><span class="metric-value val-building" id="b-period">0.00</span></div>
            </div>

            <!-- Trạm QR Code và Con lắc -->
            <div class="card no-print">
                <div class="card-title">Trạm kết nối nhanh</div>
                <div style="text-align:center; margin-bottom: 10px;">
                    <div id="qrcode-box"></div>
                    <p style="font-size: 12px; color: var(--text-muted); margin-top: 5px;">Quét mã để tự động vào phòng</p>
                </div>
                <div class="resonance-box">
                    <label style="font-weight:600; font-size: 13px;">Chiều dài L (m)</label>
                    <input type="number" id="input-L" value="0.25" step="0.01" oninput="updatePendulum()" style="width: 60px; padding: 5px;">
                    <div id="resonance-badge" class="badge-res">CHƯA ĐO</div>
                </div>
            </div>

            <div class="card no-print" id="liveChart-container">
                <canvas id="liveChart"></canvas>
            </div>

            <div class="card no-print">
                <div class="btn-group">
                    <button class="btn btn-primary" id="btn-record" onclick="startRecord()">Ghi dữ liệu</button>
                    <button class="btn btn-danger" id="btn-stop" onclick="stopRecord()" disabled>Dừng</button>
                </div>
                <button class="btn btn-export" onclick="exportCSV()" style="width: 100%; margin-bottom: 20px;">Xuất Excel</button>
                <div class="card-title">So sánh</div>
                <select id="sel-1" style="margin-bottom:10px;"><option value="">-- Không TMD --</option></select>
                <select id="sel-2" style="margin-bottom:10px;"><option value="">-- Có TMD --</option></select>
                <button class="btn btn-primary" onclick="compareSessions()" style="width: 100%;">Tính toán</button>
            </div>

            <div class="card" id="compare-result" style="display:none; grid-column: span 3;"></div>

            <div class="card" id="canvas3d-container">
                <canvas id="canvas3d"></canvas>
            </div>
        </div>
    </div>

    <script>
        let ws, currentRoom = "", isRecording = false, chart;
        let dataGround = [], dataBuilding = [];
        let gravityG = {x:0, y:0, z:0, init:false}, gravityB = {x:0, y:0, z:0, init:false};
        const alpha = 0.95;
        let calculatedSampleRate = 30;
        
        // Cấu hình cảnh báo
        const ALERT_THRESHOLD = 5.0; // Ngưỡng rung mạnh (m/s2)
        let isAlerting = false;
        const beepAudio = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

        const canvas3d = document.getElementById('canvas3d');
        const ctx3d = canvas3d.getContext('2d');
        let angleX = -0.5, angleY = 0.5, trail = [];
        const maxTrail = 100, scale3D = 80;

        function joinRoom() {
            let room = document.getElementById('input-room').value.trim().toUpperCase();
            if (!room) return alert("Nhập mã phòng!");
            currentRoom = room;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'block';
            document.getElementById('display-room').innerText = currentRoom;

            // TẠO MÃ QR CODE TỰ ĐỘNG
            document.getElementById('qrcode-box').innerHTML = "";
            new QRCode(document.getElementById("qrcode-box"), {
                text: window.location.origin + "/sensor.html?room=" + currentRoom,
                width: 100, height: 100,
                colorDark : "#000000", colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);
            ws.onopen = () => ws.send(JSON.stringify({ type: 'join', role: 'dashboard', roomCode: currentRoom }));
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'sensor-connected') {
                    if (data.role === 'GROUND') document.getElementById('status-g').innerHTML = "🟢 GROUND: Kết nối";
                    if (data.role === 'BUILDING') document.getElementById('status-b').innerHTML = "🟢 BUILDING: Kết nối";
                }
                if (data.type === 'sensor-data') processSensorData(data);
            };

            initChart();
            updateDropdowns();
            requestAnimationFrame(draw3D);
        }

        function initChart() {
            const ctx = document.getElementById('liveChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [
                    { label: 'GROUND', data: [], borderColor: '#3b82f6', borderWidth: 2, pointRadius: 0, tension: 0.3 },
                    { label: 'BUILDING', data: [], borderColor: '#ef4444', borderWidth: 2, pointRadius: 0, fill: true, backgroundColor: 'rgba(239, 68, 68, 0.1)', tension: 0.3 }
                ]},
                options: { responsive: true, maintainAspectRatio: false, animation: false }
            });
        }

        function updatePendulum() {
            let L = parseFloat(document.getElementById('input-L').value);
            if (L > 0) checkResonance((1 / (2 * Math.PI)) * Math.sqrt(9.81 / L));
        }

        function checkResonance(fTMD) {
            let fBuilding = parseFloat(document.getElementById('b-freq').innerText);
            let badge = document.getElementById('resonance-badge');
            if (fBuilding === 0) { badge.innerText = "CHƯA ĐO"; badge.style.background = "#94a3b8"; return; }
            let diff = Math.abs(fTMD - fBuilding) / fTMD;
            if (diff < 0.15) { badge.innerText = "CỘNG HƯỞNG!"; badge.style.background = "#10b981"; }
            else { badge.innerText = "CHƯA CỘNG HƯỞNG"; badge.style.background = "#ef4444"; }
        }

        function applyHighPass(raw, state) {
            if (!state.init) { state.x = raw.x; state.y = raw.y; state.z = raw.z; state.init = true; }
            let fx = raw.x - state.x, fy = raw.y - state.y, fz = raw.z - state.z;
            state.x = alpha * state.x + (1 - alpha) * raw.x;
            state.y = alpha * state.y + (1 - alpha) * raw.y;
            state.z = alpha * state.z + (1 - alpha) * raw.z;
            return { x: fx, y: fy, z: fz, mag: Math.sqrt(fx*fx + fy*fy + fz*fz) };
        }

        // Bộ lọc làm mượt dữ liệu đồ thị
        let smoothB = 0;
        function processSensorData(data) {
            if (data.role === 'GROUND') {
                let f = applyHighPass(data, gravityG);
                if (isRecording) dataGround.push(f.mag);
                chart.data.datasets[0].data.push(f.mag); chart.data.datasets[1].data.push(null);
            } else {
                let f = applyHighPass(data, gravityB);
                if (isRecording) dataBuilding.push(f.mag);
                
                // Làm mượt dữ liệu (Moving Average nhẹ)
                smoothB = smoothB * 0.7 + f.mag * 0.3;
                chart.data.datasets[0].data.push(null); chart.data.datasets[1].data.push(smoothB);

                trail.push({ x: f.x, y: f.y, z: f.z });
                if (trail.length > maxTrail) trail.shift();
            }

            chart.data.labels.push('');
            if (chart.data.labels.length > 200) {
                chart.data.labels.shift(); chart.data.datasets[0].data.shift(); chart.data.datasets[1].data.shift();
            }
            chart.update('none');
            
            if (dataBuilding.length % 10 === 0) updateLivePhysics();
        }

        function updateLivePhysics() {
            let recentB = dataBuilding.slice(-100);
            if(recentB.length < 10) return;
            
            let maxB = Math.max(...recentB), minB = Math.min(...recentB);
            let aB = (maxB - minB) / 2;
            
            // KIỂM TRA CẢNH BÁO
            if (aB > ALERT_THRESHOLD) {
                if (!isAlerting) { 
                    isAlerting = true; 
                    document.body.classList.add('alert-mode');
                    document.getElementById('b-amp').classList.add('danger');
                    beepAudio.play();
                }
            } else {
                if (isAlerting) {
                    isAlerting = false;
                    document.body.classList.remove('alert-mode');
                    document.getElementById('b-amp').classList.remove('danger');
                }
            }

            document.getElementById('b-amp').innerText = aB.toFixed(3);
            
            // Tính tần số sơ bộ
            let crosses = 0;
            for (let i = 1; i < recentB.length; i++) if (recentB[i-1] < 0 && recentB[i] >= 0) crosses++;
            let fB = crosses / (recentB.length / 30);
            if(fB > 0.5 && fB < 10) {
                document.getElementById('b-freq').innerText = fB.toFixed(2);
                updatePendulum(); // Cập nhật lại kiểm tra cộng hưởng
            }
        }

        function startRecord() {
            dataGround = []; dataBuilding = [];
            isRecording = true;
            document.getElementById('btn-record').disabled = true;
            document.getElementById('btn-stop').disabled = false;
        }

        function stopRecord() {
            isRecording = false;
            document.getElementById('btn-record').disabled = false;
            document.getElementById('btn-stop').disabled = true;
            let name = prompt("Tên phiên đo:");
            if (name) {
                let saved = JSON.parse(localStorage.getItem('tmd_' + currentRoom)) || [];
                saved.push({ name, amp: parseFloat(document.getElementById('b-amp').innerText) });
                localStorage.setItem('tmd_' + currentRoom, JSON.stringify(saved));
                updateDropdowns();
            }
        }

        function updateDropdowns() {
            let saved = JSON.parse(localStorage.getItem('tmd_' + currentRoom)) || [];
            let html = '<option value="">-- Chọn --</option>';
            saved.forEach((s, i) => html += `<option value="${i}">${s.name} (A: ${s.amp.toFixed(2)})</option>`);
            document.getElementById('sel-1').innerHTML = html;
            document.getElementById('sel-2').innerHTML = html;
        }

        function compareSessions() {
            let saved = JSON.parse(localStorage.getItem('tmd_' + currentRoom)) || [];
            let i1 = document.getElementById('sel-1').value, i2 = document.getElementById('sel-2').value;
            if (i1 === "" || i2 === "") return alert("Chọn đủ 2 phiên!");
            let s1 = saved[i1], s2 = saved[i2];
            let percent = ((s1.amp - s2.amp) / s1.amp) * 100;
            
            let res = document.getElementById('compare-result');
            res.style.display = 'block';
            res.innerHTML = `<h3 style="text-align:center;">So sánh: <span style="color:${percent>0?'#10b981':'#ef4444'}">${percent.toFixed(2)}%</span> giảm chấn</h3>`;
        }

        // TOÁN HỌC 3D (Giữ nguyên)
        function project3D(x, y, z) {
            x *= scale3D; y *= scale3D; z *= scale3D;
            let y1 = y * Math.cos(angleX) - z * Math.sin(angleX);
            let z1 = y * Math.sin(angleX) + z * Math.cos(angleX);
            let x2 = x * Math.cos(angleY) + z1 * Math.sin(angleY);
            let z2 = -x * Math.sin(angleY) + z1 * Math.cos(angleY);
            let scale = 400 / (400 + z2);
            if (scale < 0) return null;
            return { x: (canvas3d.width / 2) + x2 * scale, y: (canvas3d.height / 2) + y1 * scale, scale: scale };
        }

        function draw3D() {
            ctx3d.clearRect(0, 0, canvas3d.width, canvas3d.height);
            if (trail.length > 1) {
                ctx3d.beginPath();
                for (let i = 0; i < trail.length; i++) {
                    let p = project3D(trail[i].x, trail[i].y, trail[i].z);
                    if (!p) continue;
                    ctx3d.strokeStyle = `rgba(59, 130, 246, ${i / trail.length})`;
                    ctx3d.lineWidth = 3 * p.scale;
                    if (i === 0) ctx3d.moveTo(p.x, p.y); else ctx3d.lineTo(p.x, p.y);
                }
                ctx3d.stroke();
            }
            requestAnimationFrame(draw3D);
        }

        let isDragging = false, lastX = 0, lastY = 0;
        canvas3d.addEventListener('mousedown', (e) => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', (e) => {
            if (isDragging) { angleY += (e.clientX - lastX) * 0.01; angleX += (e.clientY - lastY) * 0.01; lastX = e.clientX; lastY = e.clientY; }
        });

        function resizeCanvas() {
            let box = document.getElementById('canvas3d-container');
            canvas3d.width = box.clientWidth; canvas3d.height = box.clientHeight;
        }
        
        function exportCSV() { alert("Chức năng xuất Excel đang hoàn thiện!"); }
    </script>
</body>
</html>
