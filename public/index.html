<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>TMD SMART - Advanced Lab</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; padding: 20px; margin: 0; color: #1e293b; }
        .container { max-width: 1200px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { color: #1d4ed8; text-align: center; }
        
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; }
        .login-box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 350px;}
        .login-box input { padding: 15px; font-size: 24px; text-align: center; text-transform: uppercase; width: 100%; border: 2px solid #cbd5e1; border-radius: 8px; margin-bottom: 20px; letter-spacing: 5px; font-weight: bold; box-sizing: border-box;}
        .login-box button { width: 100%; padding: 15px; font-size: 18px; background: #1d4ed8; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;}
        
        #main-screen { display: none; }
        .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .physics-panel { background: #0f172a; color: white; padding: 20px; border-radius: 12px; }
        .panel-title { font-size: 18px; font-weight: bold; text-align: center; color: #38bdf8; margin-bottom: 15px; }
        .metric { margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .metric-title { font-size: 13px; color: #94a3b8; text-transform: uppercase; }
        .metric-value { font-size: 28px; font-weight: bold; color: #f8fafc; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; font-size: 16px; margin-right: 10px; }
        .btn-start { background: #10b981; }
        .btn-stop { background: #ef4444; }
        .btn-pause { background: #f59e0b; }
        .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
        #chart-container { width: 100%; height: 350px; }
        select { padding: 10px; font-size: 16px; border-radius: 8px; border: 1px solid #cbd5e1; width: 100%; margin-bottom: 15px; }
        .result-box { background: #ecfdf5; border: 1px solid #10b981; padding: 20px; border-radius: 8px; font-size: 18px; margin-top: 20px; display: none;}
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <h1>TMD SMART</h1>
            <p>Advanced Signal Processing</p>
            <input type="text" id="input-room" placeholder="MÃ PHÒNG" maxlength="6">
            <button onclick="joinRoom()">Vào phòng</button>
        </div>
    </div>

    <div class="container" id="main-screen">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Phòng: <span id="display-room" style="color: #ef4444;"></span></h1>
            <div>
                <span id="status-g" style="font-weight:bold; color:#64748b;">GROUND: Chờ...</span> | 
                <span id="status-b" style="font-weight:bold; color:#64748b;">BUILDING: Chờ...</span>
            </div>
        </div>
        
        <div class="card">
            <button class="btn btn-start" id="btn-record" onclick="startRecord()">Bắt đầu ghi</button>
            <button class="btn btn-pause" id="btn-pause" onclick="togglePause()" disabled>Tạm dừng biểu đồ</button>
            <button class="btn btn-stop" id="btn-stop" onclick="stopRecord()" disabled>Dừng & Lưu</button>
            <span style="float:right; font-weight:bold; color:#3b82f6;" id="sample-rate">Tần số lấy mẫu: 0 Hz</span>
        </div>

        <div class="panels">
            <div class="physics-panel">
                <div class="panel-title">MẶT ĐẤT (GROUND)</div>
                <div class="metric"><div class="metric-title">Biên độ RMS</div><span class="metric-value" id="g-amp">0.000</span> m/s²</div>
                <div class="metric"><div class="metric-title">Tần số (FFT)</div><span class="metric-value" id="g-freq">0.00</span> Hz</div>
            </div>
            <div class="physics-panel" style="border: 2px solid #ef4444;">
                <div class="panel-title" style="color: #fca5a5;">TÒA NHÀ (BUILDING)</div>
                <div class="metric"><div class="metric-title">Biên độ RMS</div><span class="metric-value" id="b-amp">0.000</span> m/s²</div>
                <div class="metric"><div class="metric-title">Tần số (FFT)</div><span class="metric-value" id="b-freq">0.00</span> Hz</div>
            </div>
        </div>

        <div class="card"><div id="chart-container"><canvas id="liveChart"></canvas></div></div>

        <div class="card">
            <h3>So sánh hiệu quả giảm chấn (Dựa trên Biên độ RMS)</h3>
            <div style="display:flex; gap:20px;">
                <div style="flex:1;"><label>Phiên 1 (Không TMD):</label><select id="sel-1"></select></div>
                <div style="flex:1;"><label>Phiên 2 (Có TMD):</label><select id="sel-2"></select></div>
            </div>
            <button class="btn btn-start" style="margin-top:15px;" onclick="compareSessions()">So sánh</button>
            <div id="compare-result" class="result-box"></div>
        </div>
    </div>

    <script>
        let ws;
        let currentRoom = "";
        let isRecording = false;
        let isPaused = false;
        let chart;

        let rawGround = [], rawBuilding = [];
        let dataGround = [], dataBuilding = [];
        
        let gravityG = {x: 0, y: 0, z: 0, initialized: false};
        let gravityB = {x: 0, y: 0, z: 0, initialized: false};
        const alpha = 0.95;

        let lastTimestamp = 0;
        let calculatedSampleRate = 0;

        function joinRoom() {
            let room = document.getElementById('input-room').value.trim().toUpperCase();
            if (!room) return alert("Nhập mã phòng!");
            currentRoom = room;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'block';
            document.getElementById('display-room').innerText = currentRoom;

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'join', role: 'dashboard', roomCode: currentRoom }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'sensor-connected') {
                    if (data.role === 'GROUND') document.getElementById('status-g').innerText = "GROUND: Đã kết nối";
                    if (data.role === 'BUILDING') document.getElementById('status-b').innerText = "BUILDING: Đã kết nối";
                }
                if (data.type === 'sensor-data') processSensorData(data);
            };

            initChart();
            updateDropdowns();
        }

        function initChart() {
            const ctx = document.getElementById('liveChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [
                    { label: 'GROUND', data: [], borderColor: '#3b82f6', borderWidth: 1.5, pointRadius: 0 },
                    { label: 'BUILDING', data: [], borderColor: '#ef4444', borderWidth: 1.5, pointRadius: 0 }
                ]},
                options: { responsive: true, maintainAspectRatio: false, animation: false, scales: { x: { display: false } } }
            });
        }

        function applyHighPass(raw, state) {
            if (!state.initialized) {
                state.x = raw.x; state.y = raw.y; state.z = raw.z;
                state.initialized = true;
            }
            let fx = raw.x - state.x;
            let fy = raw.y - state.y;
            let fz = raw.z - state.z;

            state.x = alpha * state.x + (1 - alpha) * raw.x;
            state.y = alpha * state.y + (1 - alpha) * raw.y;
            state.z = alpha * state.z + (1 - alpha) * raw.z;

            return Math.sqrt(fx*fx + fy*fy + fz*fz);
        }

        function processSensorData(data) {
            if (lastTimestamp > 0 && data.t > lastTimestamp) {
                let dt = (data.t - lastTimestamp) / 1000;
                if (dt > 0 && dt < 1) {
                    let currentHz = 1 / dt;
                    calculatedSampleRate = calculatedSampleRate * 0.9 + currentHz * 0.1;
                    document.getElementById('sample-rate').innerText = `Tần số lấy mẫu: ${calculatedSampleRate.toFixed(1)} Hz`;
                }
            }
            lastTimestamp = data.t;

            let filteredAccel = 0;
            if (data.role === 'GROUND') {
                filteredAccel = applyHighPass(data, gravityG);
                if (isRecording) { rawGround.push(filteredAccel); dataGround.push(filteredAccel); }
                if (!isPaused) { chart.data.datasets[0].data.push(filteredAccel); chart.data.datasets[1].data.push(null); }
            } else {
                filteredAccel = applyHighPass(data, gravityB);
                if (isRecording) { rawBuilding.push(filteredAccel); dataBuilding.push(filteredAccel); }
                if (!isPaused) { chart.data.datasets[0].data.push(null); chart.data.datasets[1].data.push(filteredAccel); }
            }

            if (!isPaused) {
                chart.data.labels.push('');
                if (chart.data.labels.length > 250) {
                    chart.data.labels.shift(); chart.data.datasets[0].data.shift(); chart.data.datasets[1].data.shift();
                }
                chart.update('none');
            }

            if (isRecording && dataBuilding.length % 10 === 0) updateLivePhysics();
        }

        function calculateFFT(data, fs) {
            let N = 256;
            if (data.length < N) return 0;
            let signal = data.slice(-N);
            let mean = signal.reduce((a, b) => a + b, 0) / N;
            signal = signal.map(v => v - mean);

            function fft(re, im) {
                let n = re.length;
                for (let i = 1, j = 0; i < n; i++) {
                    let bit = n >> 1;
                    for (; j & bit; bit >>= 1) j ^= bit;
                    j ^= bit;
                    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
                }
                for (let len = 2; len <= n; len <<= 1) {
                    let ang = -2 * Math.PI / len;
                    let wlenRe = Math.cos(ang), wlenIm = Math.sin(ang);
                    for (let i = 0; i < n; i += len) {
                        let wRe = 1, wIm = 0;
                        for (let j = 0; j < len / 2; j++) {
                            let uRe = re[i+j], uIm = im[i+j];
                            let vRe = re[i+j+len/2] * wRe - im[i+j+len/2] * wIm;
                            let vIm = re[i+j+len/2] * wIm + im[i+j+len/2] * wRe;
                            re[i+j] = uRe + vRe; im[i+j] = uIm + vIm;
                            re[i+j+len/2] = uRe - vRe; im[i+j+len/2] = uIm - vIm;
                            let nextWRe = wRe * wlenRe - wIm * wlenIm;
                            wIm = wRe * wlenIm + wIm * wlenRe; wRe = nextWRe;
                        }
                    }
                }
            }

            let re = [...signal];
            let im = new Array(N).fill(0);
            fft(re, im);

            let maxMag = 0, peakIndex = 0;
            for (let i = 1; i < N / 2; i++) {
                let mag = Math.sqrt(re[i]*re[i] + im[i]*im[i]);
                if (mag > maxMag) { maxMag = mag; peakIndex = i; }
            }

            let peakFreq = (peakIndex * fs) / N;
            return (peakFreq > 0.5 && peakFreq < 10) ? peakFreq : 0;
        }

        function calculateRMS(data) {
            if (data.length === 0) return 0;
            let mean = data.reduce((a, b) => a + b, 0) / data.length;
            let sq = data.reduce((a, b) => a + (b - mean) ** 2, 0) / data.length;
            return Math.sqrt(sq);
        }

        function updateLivePhysics() {
            let recentG = dataGround.slice(-500);
            let recentB = dataBuilding.slice(-500);

            document.getElementById('g-amp').innerText = calculateRMS(recentG).toFixed(3);
            document.getElementById('g-freq').innerText = calculateFFT(recentG, calculatedSampleRate || 30).toFixed(2);

            document.getElementById('b-amp').innerText = calculateRMS(recentB).toFixed(3);
            document.getElementById('b-freq').innerText = calculateFFT(recentB, calculatedSampleRate || 30).toFixed(2);
        }

        function startRecord() {
            rawGround = []; rawBuilding = []; dataGround = []; dataBuilding = [];
            isRecording = true; isPaused = false;
            document.getElementById('btn-record').disabled = true;
            document.getElementById('btn-pause').disabled = false;
            document.getElementById('btn-stop').disabled = false;
            document.getElementById('btn-pause').innerText = "Tạm dừng biểu đồ";
        }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('btn-pause').innerText = isPaused ? "Tiếp tục biểu đồ" : "Tạm dừng biểu đồ";
        }

        function stopRecord() {
            isRecording = false; isPaused = false;
            document.getElementById('btn-record').disabled = false;
            document.getElementById('btn-pause').disabled = true;
            document.getElementById('btn-stop').disabled = true;
            
            let name = prompt("Nhập tên phiên (VD: Khong_TMD):");
            if (!name) return;
            
            let saved = JSON.parse(localStorage.getItem('tmd_sessions_' + currentRoom)) || [];
            saved.push({ 
                name, 
                rmsB: calculateRMS(dataBuilding), 
                rmsG: calculateRMS(dataGround),
                freqB: calculateFFT(dataBuilding, calculatedSampleRate || 30)
            });
            localStorage.setItem('tmd_sessions_' + currentRoom, JSON.stringify(saved));
            alert("Đã lưu dữ liệu!");
            updateDropdowns();
        }

        function updateDropdowns() {
            let saved = JSON.parse(localStorage.getItem('tmd_sessions_' + currentRoom)) || [];
            let html = '<option value="">-- Chọn --</option>';
            saved.forEach((s, i) => html += `<option value="${i}">${s.name} (RMS: ${s.rmsB.toFixed(3)})</option>`);
            document.getElementById('sel-1').innerHTML = html;
            document.getElementById('sel-2').innerHTML = html;
        }

        function compareSessions() {
            let saved = JSON.parse(localStorage.getItem('tmd_sessions_' + currentRoom)) || [];
            let i1 = document.getElementById('sel-1').value;
            let i2 = document.getElementById('sel-2').value;
            if (i1 === "" || i2 === "") return alert("Chọn đủ 2 phiên!");
            
            let s1 = saved[i1], s2 = saved[i2];
            let percent = ((s1.rmsB - s2.rmsB) / s1.rmsB) * 100;
            let color = percent > 0 ? '#10b981' : '#ef4444';
            
            let res = document.getElementById('compare-result');
            res.style.display = 'block';
            res.innerHTML = `
                <h3>KẾT QUẢ PHÂN TÍCH (RMS)</h3>
                <p>Phiên 1 (${s1.name}): RMS = ${s1.rmsB.toFixed(3)} m/s² | Tần số = ${s1.freqB.toFixed(2)} Hz</p>
                <p>Phiên 2 (${s2.name}): RMS = ${s2.rmsB.toFixed(3)} m/s² | Tần số = ${s2.freqB.toFixed(2)} Hz</p>
                <p style="font-size: 24px;">Mức giảm biên độ: <strong style="color: ${color}">${percent.toFixed(2)}%</strong></p>
                <p style="font-size: 14px; color:#64748b;">(Sử dụng giá trị RMS - Root Mean Square để đánh giá chính xác năng lượng dao động trung bình).</p>
            `;
        }
    </script>
</body>
</html>
