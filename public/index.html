<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>TMD SMART - Vật lý 11</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; padding: 20px; margin: 0; color: #1e293b; }
        .container { max-width: 1200px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { color: #1d4ed8; text-align: center; }
        h3 { border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; }
        .login-box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 350px;}
        .login-box input { padding: 15px; font-size: 24px; text-align: center; text-transform: uppercase; width: 100%; border: 2px solid #cbd5e1; border-radius: 8px; margin-bottom: 20px; letter-spacing: 5px; font-weight: bold; box-sizing: border-box;}
        .login-box button { width: 100%; padding: 15px; font-size: 18px; background: #1d4ed8; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;}
        
        #main-screen { display: none; }
        .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .physics-panel { background: #0f172a; color: white; padding: 20px; border-radius: 12px; }
        .panel-title { font-size: 18px; font-weight: bold; text-align: center; color: #38bdf8; margin-bottom: 15px; }
        .metric { margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .metric-title { font-size: 13px; color: #94a3b8; text-transform: uppercase; }
        .metric-value { font-size: 28px; font-weight: bold; color: #f8fafc; }
        
        .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; font-size: 16px; margin-right: 10px; }
        .btn-start { background: #10b981; }
        .btn-stop { background: #ef4444; }
        .btn-pause { background: #f59e0b; }
        .btn-export { background: #8b5cf6; }
        .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
        
        #chart-container { width: 100%; height: 350px; }
        select { padding: 10px; font-size: 16px; border-radius: 8px; border: 1px solid #cbd5e1; width: 100%; margin-bottom: 15px; }
        .result-box { background: #ecfdf5; border: 1px solid #10b981; padding: 20px; border-radius: 8px; font-size: 18px; margin-top: 20px; display: none;}
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <h1>TMD SMART</h1>
            <p>Phân tích dao động - Vật lý 11</p>
            <input type="text" id="input-room" placeholder="MÃ PHÒNG" maxlength="6">
            <button onclick="joinRoom()">Vào phòng</button>
        </div>
    </div>

    <div class="container" id="main-screen">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Phòng: <span id="display-room" style="color: #ef4444;"></span></h1>
            <div>
                <span id="status-g" style="font-weight:bold; color:#64748b;">GROUND: Chờ...</span> | 
                <span id="status-b" style="font-weight:bold; color:#64748b;">BUILDING: Chờ...</span>
            </div>
        </div>
        
        <div class="card">
            <button class="btn btn-start" id="btn-record" onclick="startRecord()">Bắt đầu ghi</button>
            <button class="btn btn-pause" id="btn-pause" onclick="togglePause()" disabled>Tạm dừng</button>
            <button class="btn btn-stop" id="btn-stop" onclick="stopRecord()" disabled>Dừng & Lưu</button>
            <button class="btn btn-export" onclick="exportCSV()">Xuất file CSV (Excel)</button>
        </div>

        <div class="panels">
            <div class="physics-panel">
                <div class="panel-title">MẶT ĐẤT (GROUND)</div>
                <div class="metric"><div class="metric-title">Biên độ A</div><span class="metric-value" id="g-amp">0.000</span> m/s²</div>
                <div class="metric"><div class="metric-title">Tần số f</div><span class="metric-value" id="g-freq">0.00</span> Hz</div>
                <div class="metric"><div class="metric-title">Chu kỳ T</div><span class="metric-value" id="g-period">0.00</span> s</div>
            </div>
            <div class="physics-panel" style="border: 2px solid #ef4444;">
                <div class="panel-title" style="color: #fca5a5;">TÒA NHÀ (BUILDING)</div>
                <div class="metric"><div class="metric-title">Biên độ A</div><span class="metric-value" id="b-amp">0.000</span> m/s²</div>
                <div class="metric"><div class="metric-title">Tần số f</div><span class="metric-value" id="b-freq">0.00</span> Hz</div>
                <div class="metric"><div class="metric-title">Chu kỳ T</div><span class="metric-value" id="b-period">0.00</span> s</div>
            </div>
        </div>

        <div class="card"><div id="chart-container"><canvas id="liveChart"></canvas></div></div>

        <div class="card">
            <h3>Kiểm chứng hiệu quả của TMD</h3>
            <div style="display:flex; gap:20px;">
                <div style="flex:1;"><label>Phiên 1 (Không TMD):</label><select id="sel-1"></select></div>
                <div style="flex:1;"><label>Phiên 2 (Có TMD):</label><select id="sel-2"></select></div>
            </div>
            <button class="btn btn-start" style="margin-top:15px;" onclick="compareSessions()">So sánh & Vẽ đồ thị</button>
            
            <div id="compare-result" class="result-box"></div>
            
            <div id="compare-chart-container" style="display:none; width: 100%; height: 300px; margin-top: 20px;">
                <canvas id="overlayChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let ws;
        let currentRoom = "";
        let isRecording = false;
        let isPaused = false;
        let chart, overlayChart;

        let dataGround = [], dataBuilding = [];
        
        // Bộ lọc bóc trọng lực
        let gravityG = {x: 0, y: 0, z: 0, initialized: false};
        let gravityB = {x: 0, y: 0, z: 0, initialized: false};
        const alpha = 0.95;
        let lastTimestamp = 0;
        let calculatedSampleRate = 30; // Mặc định 30Hz

        function joinRoom() {
            let room = document.getElementById('input-room').value.trim().toUpperCase();
            if (!room) return alert("Nhập mã phòng!");
            currentRoom = room;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'block';
            document.getElementById('display-room').innerText = currentRoom;

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'join', role: 'dashboard', roomCode: currentRoom }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'sensor-connected') {
                    if (data.role === 'GROUND') document.getElementById('status-g').innerText = "GROUND: Đã kết nối";
                    if (data.role === 'BUILDING') document.getElementById('status-b').innerText = "BUILDING: Đã kết nối";
                }
                if (data.type === 'sensor-data') processSensorData(data);
            };

            initChart();
            updateDropdowns();
        }

        function initChart() {
            const ctx = document.getElementById('liveChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [
                    { label: 'GROUND', data: [], borderColor: '#3b82f6', borderWidth: 1.5, pointRadius: 0 },
                    { label: 'BUILDING', data: [], borderColor: '#ef4444', borderWidth: 1.5, pointRadius: 0 }
                ]},
                options: { responsive: true, maintainAspectRatio: false, animation: false, scales: { x: { display: false } } }
            });
        }

        // Lọc bỏ trọng lực (chỉ giữ lại dao động)
        function applyHighPass(raw, state) {
            if (!state.initialized) {
                state.x = raw.x; state.y = raw.y; state.z = raw.z;
                state.initialized = true;
            }
            let fx = raw.x - state.x;
            let fy = raw.y - state.y;
            let fz = raw.z - state.z;

            state.x = alpha * state.x + (1 - alpha) * raw.x;
            state.y = alpha * state.y + (1 - alpha) * raw.y;
            state.z = alpha * state.z + (1 - alpha) * raw.z;

            return Math.sqrt(fx*fx + fy*fy + fz*fz);
        }

        function processSensorData(data) {
            if (lastTimestamp > 0 && data.t > lastTimestamp) {
                let dt = (data.t - lastTimestamp) / 1000;
                if (dt > 0 && dt < 1) calculatedSampleRate = 1 / dt; // Cập nhật tần số thực tế
            }
            lastTimestamp = data.t;

            let filteredAccel = 0;
            if (data.role === 'GROUND') {
                filteredAccel = applyHighPass(data, gravityG);
                if (isRecording) dataGround.push(filteredAccel);
                if (!isPaused) { chart.data.datasets[0].data.push(filteredAccel); chart.data.datasets[1].data.push(null); }
            } else {
                filteredAccel = applyHighPass(data, gravityB);
                if (isRecording) dataBuilding.push(filteredAccel);
                if (!isPaused) { chart.data.datasets[0].data.push(null); chart.data.datasets[1].data.push(filteredAccel); }
            }

            if (!isPaused) {
                chart.data.labels.push('');
                if (chart.data.labels.length > 250) {
                    chart.data.labels.shift(); chart.data.datasets[0].data.shift(); chart.data.datasets[1].data.shift();
                }
                chart.update('none');
            }

            if (isRecording && dataBuilding.length % 10 === 0) updateLivePhysics();
        }

        // === TÍNH TOÁN VẬT LÝ 11 (ĐƠN GIẢN, DỄ HIỂU) ===
        
        // 1. Tính biên độ A = (Max - Min) / 2
        function calculateAmplitude(data) {
            if (data.length < 30) return 0;
            let recent = data.slice(-100); // Lấy 100 mẫu gần nhất
            let max = Math.max(...recent);
            let min = Math.min(...recent);
            return (max - min) / 2;
        }

        // 2. Tính tần số bằng phương pháp đếm điểm cắt trục 0 (Zero-crossing)
        function calculateFrequency(data, fs) {
            if (data.length < 50) return 0;
            let recent = data.slice(-100);
            let crossings = 0;
            
            for (let i = 1; i < recent.length; i++) {
                // Nếu mẫu trước âm và mẫu này dương (cắt trục 0 đi lên)
                if (recent[i-1] < 0 && recent[i] >= 0) crossings++;
            }
            
            // Thời gian của 100 mẫu này = số mẫu / tần số lấy mẫu
            let timeWindow = recent.length / fs;
            
            // Số chu kỳ = số lần cắt trục 0 (đi lên)
            let f = crossings / timeWindow;
            
            // Lọc nhiễu tần số (chỉ lấy từ 0.5 Hz đến 10 Hz)
            return (f > 0.5 && f < 10) ? f : 0;
        }

        function updateLivePhysics() {
            // Xử lý GROUND
            let aG = calculateAmplitude(dataGround);
            let fG = calculateFrequency(dataGround, calculatedSampleRate);
            document.getElementById('g-amp').innerText = aG.toFixed(3);
            document.getElementById('g-freq').innerText = fG.toFixed(2);
            document.getElementById('g-period').innerText = fG > 0 ? (1/fG).toFixed(2) : "0.00";

            // Xử lý BUILDING
            let aB = calculateAmplitude(dataBuilding);
            let fB = calculateFrequency(dataBuilding, calculatedSampleRate);
            document.getElementById('b-amp').innerText = aB.toFixed(3);
            document.getElementById('b-freq').innerText = fB.toFixed(2);
            document.getElementById('b-period').innerText = fB > 0 ? (1/fB).toFixed(2) : "0.00";
        }

        function startRecord() {
            dataGround = []; dataBuilding = [];
            isRecording = true; isPaused = false;
            document.getElementById('btn-record').disabled = true;
            document.getElementById('btn-pause').disabled = false;
            document.getElementById('btn-stop').disabled = false;
        }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('btn-pause').innerText = isPaused ? "Tiếp tục" : "Tạm dừng";
        }

        function stopRecord() {
            isRecording = false; isPaused = false;
            document.getElementById('btn-record').disabled = false;
            document.getElementById('btn-pause').disabled = true;
            document.getElementById('btn-stop').disabled = true;
            
            let name = prompt("Nhập tên phiên (VD: Khong_TMD):");
            if (!name) return;
            
            let saved = JSON.parse(localStorage.getItem('tmd_sessions_' + currentRoom)) || [];
            saved.push({ 
                name, 
                ampB: calculateAmplitude(dataBuilding), 
                freqB: calculateFrequency(dataBuilding, calculatedSampleRate),
                // Lưu mảng dữ liệu để vẽ đồ thị chồng
                chartData: dataBuilding.filter((_, index) => index % Math.ceil(dataBuilding.length / 300) === 0)
            });
            localStorage.setItem('tmd_sessions_' + currentRoom, JSON.stringify(saved));
            alert("Đã lưu dữ liệu thành công!");
            updateDropdowns();
        }

        function updateDropdowns() {
            let saved = JSON.parse(localStorage.getItem('tmd_sessions_' + currentRoom)) || [];
            let html = '<option value="">-- Chọn --</option>';
            saved.forEach((s, i) => html += `<option value="${i}">${s.name} (Biên độ A: ${s.ampB.toFixed(3)})</option>`);
            document.getElementById('sel-1').innerHTML = html;
            document.getElementById('sel-2').innerHTML = html;
        }

        // === SO SÁNH VÀ VẼ ĐỒ THỊ CHỒNG ===
        function compareSessions() {
            let saved = JSON.parse(localStorage.getItem('tmd_sessions_' + currentRoom)) || [];
            let i1 = document.getElementById('sel-1').value;
            let i2 = document.getElementById('sel-2').value;
            if (i1 === "" || i2 === "") return alert("Chọn đủ 2 phiên!");
            
            let s1 = saved[i1], s2 = saved[i2];
            let percent = ((s1.ampB - s2.ampB) / s1.ampB) * 100;
            let color = percent > 0 ? '#10b981' : '#ef4444';
            
            let res = document.getElementById('compare-result');
            res.style.display = 'block';
            res.innerHTML = `
                <h3>KẾT QUẢ ĐO</h3>
                <p><b>Không TMD (${s1.name}):</b> Biên độ A = ${s1.ampB.toFixed(3)} m/s² | Tần số f = ${s1.freqB.toFixed(2)} Hz</p>
                <p><b>Có TMD (${s2.name}):</b> Biên độ A = ${s2.ampB.toFixed(3)} m/s² | Tần số f = ${s2.freqB.toFixed(2)} Hz</p>
                <hr>
                <p style="font-size: 24px;">Mức giảm biên độ: <strong style="color: ${color}">${percent.toFixed(2)}%</strong></p>
                <p style="font-size: 15px; color:#475569;">Công thức tính: % giảm = [(A<sub>không TMD</sub> - A<sub>có TMD</sub>) / A<sub>không TMD</sub>] × 100%</p>
            `;

            document.getElementById('compare-chart-container').style.display = 'block';
            if (overlayChart) overlayChart.destroy();
            
            const ctx = document.getElementById('overlayChart').getContext('2d');
            overlayChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array(Math.max(s1.chartData.length, s2.chartData.length)).fill(''),
                    datasets: [
                        { label: 'Không TMD', data: s1.chartData, borderColor: '#ef4444', borderWidth: 2, pointRadius: 0 },
                        { label: 'Có TMD', data: s2.chartData, borderColor: '#10b981', borderWidth: 2, pointRadius: 0 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, animation: false }
            });
        }

        function exportCSV() {
            if (dataBuilding.length === 0) return alert("Chưa có dữ liệu để xuất!");
            
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
            csvContent += "ThoiGian(s),GROUND(m/s2),BUILDING(m/s2)\n";
            
            let dt = 1 / calculatedSampleRate;
            let maxLen = Math.max(dataGround.length, dataBuilding.length);
            for (let i = 0; i < maxLen; i++) {
                let time = (i * dt).toFixed(3);
                let g = dataGround[i] ? dataGround[i].toFixed(4) : "";
                let b = dataBuilding[i] ? dataBuilding[i].toFixed(4) : "";
                csvContent += `${time},${g},${b}\n`;
            }
            
            let encodedUri = encodeURI(csvContent);
            let link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `TMD_Data_${currentRoom}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
